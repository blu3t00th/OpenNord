name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  common-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: linux_gcc_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed build outputs
        shell: pwsh
        run: |
          $generated = @(git ls-files -- 'cmake-build-*' 'package' '*.exe' '*.dll' '*.obj' '*.o' 'CMakeCache.txt')
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect source tree" }
          if ($generated.Count) { throw "Generated binaries/build outputs must not be committed: $($generated -join ', ')" }
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix staging
          if ($LASTEXITCODE -ne 0) { throw "CMake install failed" }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations staging\OpenNord.exe
          if ($LASTEXITCODE -ne 0) { throw "GUI dependency deployment failed" }
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" --release --no-translations staging\OpenNordService.exe
          if ($LASTEXITCODE -ne 0) { throw "Service dependency deployment failed" }
          Copy-Item LICENSE, README.md, SECURITY.md staging
      - name: Package
        shell: pwsh
        run: ./scripts/Package-Windows.ps1 -MakeNsis "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenNord-windows-x64-unsigned
          path: dist
          if-no-files-found: error

